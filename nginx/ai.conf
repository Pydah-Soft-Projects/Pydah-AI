# Nginx configuration for nemo-ai.pydah.edu.in
# Place this file in: /etc/nginx/conf.d/ai.conf

server {
    listen 80;
    listen [::]:80;
    server_name nemo-ai.pydah.edu.in;

    # Maximum request body size
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Optional CDN Static Files for Chat UI
    location /cdn/ {
        alias /var/www/pydah-cdn/dist/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Reverse proxy to Pydah AI FastAPI backend (running on port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM response generation timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

